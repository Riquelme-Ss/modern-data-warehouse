services:
  minio:
    image: minio/minio:latest
    container_name: mdw-minio
    hostname: minio

    command:
      - server
      - /data
      - --console-address
      - :9001

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

  postgres:
    image: postgres:16
    container_name: mdw-postgres
    hostname: postgres

    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  spark:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile

    image: modern-data-warehouse-spark:3.5.6
    container_name: mdw-spark
    hostname: spark

    user: root

    command:
      - bash
      - -c
      - |
        mkdir -p /home/spark/.ivy2/cache
        mkdir -p /opt/spark/conf

        chown -R spark:spark /home/spark

        cat > /opt/spark/conf/spark-defaults.conf <<'EOF'
        spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
        spark.hadoop.fs.s3a.endpoint=http://minio:9000
        spark.hadoop.fs.s3a.access.key=admin
        spark.hadoop.fs.s3a.secret.key=minioadmin
        spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
        spark.hadoop.fs.s3a.path.style.access=true
        spark.hadoop.fs.s3a.connection.ssl.enabled=false
        spark.hadoop.fs.s3a.endpoint.region=us-east-1
        spark.hadoop.fs.s3a.fast.upload=true
        EOF

        chown spark:spark /opt/spark/conf/spark-defaults.conf

        su -s /bin/bash spark -c "/opt/spark/sbin/start-master.sh --host spark --port 7077 --webui-port 8080"

        tail -f /dev/null

    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1

    depends_on:
      - minio
      - postgres

    ports:
      - "8080:8080"
      - "7077:7077"

    volumes:
      - ./spark:/opt/spark/work
      - spark_home:/home/spark

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.6.latest
    container_name: mdw-dbt
    hostname: dbt

    working_dir: /usr/app/dbt

    depends_on:
      - postgres

    ports:
      - "8081:8081"

    volumes:
      - ./dbt:/usr/app/dbt

volumes:
  minio_data:
    name: modern-data-warehouse_minio_data

  postgres_data:
    name: modern-data-warehouse_postgres_data

  spark_home:
    name: modern-data-warehouse_spark_home